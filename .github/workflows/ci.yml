name: CI

# What this does:
#   * test   — runs backend + frontend checks on every push/PR (fast gate).
#   * build  — on a v* tag or manual dispatch, builds native installers for all
#              three platforms (each on its own OS, because a .msi needs Windows,
#              a .dmg needs macOS, etc.) and uploads them as workflow artifacts.
#   * release — on a v* tag only, gathers every platform's installers and
#              publishes ONE GitHub Release with them attached.
#
# The release is a SEPARATE job (not done inside the per-OS matrix) so there is a
# single writer to the release — no three-way race — and it holds the one place
# that needs `contents: write`.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; the release job opts into write below.
permissions:
  contents: read

# Don't pile up redundant runs. Never cancel a tag/main build (a release must
# finish); only superseded PR runs get cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Test (backend + frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install backend deps
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r backend/requirements.txt
          .venv/bin/python -m pip install pytest httpx

      - name: Run backend tests
        working-directory: backend
        run: ../.venv/bin/python -m pytest -q

      - name: Build frontend (typecheck + bundle)
        working-directory: desktop
        run: |
          npm ci
          npm run build

  build:
    name: Build ${{ matrix.name }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            bundles: |
              desktop/src-tauri/target/release/bundle/msi/*.msi
              desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          - os: macos-latest
            name: macOS
            bundles: |
              desktop/src-tauri/target/release/bundle/dmg/*.dmg
          - os: ubuntu-latest
            name: Linux
            bundles: |
              desktop/src-tauri/target/release/bundle/deb/*.deb
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              desktop/src-tauri/target/release/bundle/rpm/*.rpm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps (Tauri)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf build-essential libssl-dev libgtk-3-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-

      - name: Set up Python venv + deps
        shell: bash
        run: |
          python -m venv .venv
          if [ "${{ matrix.os }}" = "windows-latest" ]; then PY=.venv/Scripts/python; else PY=.venv/bin/python; fi
          $PY -m pip install --upgrade pip
          $PY -m pip install -r backend/requirements.txt pyinstaller

      - name: Build backend sidecar
        shell: bash
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            pwsh scripts/build_sidecar.ps1
          else
            bash scripts/build_sidecar.sh
          fi

      - name: Install frontend deps
        working-directory: desktop
        run: npm ci

      - name: Build native app (Tauri)
        working-directory: desktop
        run: npm run tauri:build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: lumaforge-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    # Run even if a platform failed, so the installers that DID build still get
    # published — but only for a version tag. The verify step below fails the
    # job if nothing at all was produced.
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: List and verify installers
        run: |
          echo "Downloaded files:"
          find installers -type f -printf '  %p  (%s bytes)\n' || true
          count=$(find installers -type f \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.dmg' \
               -o -name '*.deb' -o -name '*.AppImage' -o -name '*.rpm' \) | wc -l)
          echo "Installer count: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::No installer artifacts were produced — refusing to publish an empty release."
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            installers/**/*.msi
            installers/**/*.exe
            installers/**/*.dmg
            installers/**/*.deb
            installers/**/*.AppImage
            installers/**/*.rpm
          # Individual patterns may match nothing on a given run (e.g. no .rpm);
          # that's fine — the verify step already guaranteed at least one file.
          fail_on_unmatched_files: false
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
