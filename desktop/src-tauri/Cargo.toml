[package]
name = "lumetta"
version = "5.0.0"
description = "Lumetta — AI photo enhancement & DSLR conversion studio"
authors = ["Lumetta"]
edition = "2021"
rust-version = "1.77"

# The library is what Tauri runs; main.rs is a thin launcher. This split is the
# Tauri 2 convention and also enables mobile targets later.
[lib]
name = "lumetta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# this feature is used for production builds or when a dev server is not specified
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
