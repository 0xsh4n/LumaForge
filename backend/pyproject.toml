[project]
name = "lumaforge-backend"
version = "0.1.0"
description = "Local image-processing backend for the LumaForge desktop app"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "numpy>=1.26",
    "pillow>=10.3",
    "opencv-python-headless>=4.9",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
formats = ["pillow-heif>=0.16", "rawpy>=0.19"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
lumaforge-backend = "app.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.imaging", "app.routers"]
